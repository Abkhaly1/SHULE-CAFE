<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password ‹ SHULE CAFE</title>
    
    <!-- Design System CSS -->
    <link rel="stylesheet" href="css/design-system.css">
    
    <style>
        body {
            background-color: var(--c-bg-page);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            font-family: var(--font-family);
        }
        
        .auth-container {
            width: 100%;
            max-width: 450px;
            padding: var(--sp-6);
        }
        
        .auth-card {
            background: var(--c-bg-surface);
            padding: var(--sp-8);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            border: 1px solid var(--c-border-light);
        }
        
        .auth-logo {
            text-align: center;
            margin-bottom: var(--sp-8);
            font-size: 24px;
            font-weight: 700;
            color: var(--c-primary);
        }
        
        .auth-title {
            font-size: var(--text-xl);
            font-weight: 600;
            color: var(--c-text-primary);
            margin-bottom: var(--sp-2);
            text-align: center;
        }
        
        .auth-subtitle {
            text-align: center;
            color: var(--c-text-secondary);
            font-size: var(--text-sm);
            margin-bottom: var(--sp-6);
            line-height: 1.5;
        }
        
        .password-input-group {
            position: relative;
        }
        
        .password-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--c-text-muted);
            cursor: pointer;
            padding: 0;
        }
        
        .password-toggle:hover {
            color: var(--c-text-primary);
        }
        
        .password-strength {
            margin-top: var(--sp-2);
            font-size: 12px;
        }
        
        .strength-bar {
            height: 4px;
            background: var(--c-border-light);
            border-radius: 2px;
            margin-bottom: 4px;
            display: flex;
            gap: 2px;
            overflow: hidden;
        }
        
        .strength-segment {
            flex: 1;
            background: transparent;
            transition: background 0.3s ease;
        }
        
        .strength-text {
            color: var(--c-text-muted);
            display: flex;
            justify-content: space-between;
        }
        
        .strength-reqs {
            margin-top: var(--sp-2);
            padding-left: var(--sp-4);
            color: var(--c-text-secondary);
            margin-bottom: 0;
        }
        
        .req-item {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 4px;
        }
        
        .req-item.met {
            color: var(--c-success);
        }
        .req-item.met svg {
            fill: var(--c-success);
        }
        
        .auth-footer {
            margin-top: var(--sp-8);
            text-align: center;
            font-size: var(--text-sm);
            color: var(--c-text-muted);
        }
    </style>
</head>
<body>
    
    <div class="auth-container">
        <div class="auth-logo">
            <!-- Placeholder Logo -->
            SHULE CAFE
        </div>
        
        <div class="auth-card">
            <h1 class="auth-title" id="pageTitle">Reset Password</h1>
            <p class="auth-subtitle" id="pageSubtitle">Please enter your new password below.</p>
            
            <div id="resetAlert" class="alert alert-danger" style="display: none; margin-bottom: var(--sp-4);"></div>
            
            <form id="resetPasswordForm">
                
                <!-- This field is only visible for "Force Password Change" flows -->
                <div class="form-group" id="currentPasswordGroup" style="display: none; margin-bottom: var(--sp-4);">
                    <label for="currentPassword" class="form-label">Current / Temporary Password</label>
                    <div class="password-input-group">
                        <input type="password" id="currentPassword" class="form-control" placeholder="Enter current password">
                        <button type="button" class="password-toggle" onclick="togglePasswordVisibility('currentPassword')" aria-label="Toggle password visibility">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
                        </button>
                    </div>
                </div>
                
                <div class="form-group" style="margin-bottom: var(--sp-4);">
                    <label for="newPassword" class="form-label">New Password</label>
                    <div class="password-input-group">
                        <input type="password" id="newPassword" class="form-control" placeholder="Enter new password" required>
                        <button type="button" class="password-toggle" onclick="togglePasswordVisibility('newPassword')" aria-label="Toggle password visibility">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
                        </button>
                    </div>
                    
                    <div class="password-strength">
                        <div class="strength-bar">
                            <div class="strength-segment" id="seg1"></div>
                            <div class="strength-segment" id="seg2"></div>
                            <div class="strength-segment" id="seg3"></div>
                            <div class="strength-segment" id="seg4"></div>
                        </div>
                        <div class="strength-text">
                            <span>Password Strength: <strong id="strengthLabel">Weak</strong></span>
                        </div>
                        <ul class="strength-reqs">
                            <li class="req-item" id="reqLength">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="8"/></svg> At least 8 characters
                            </li>
                            <li class="req-item" id="reqUpperLower">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="8"/></svg> Uppercase & Lowercase letters
                            </li>
                            <li class="req-item" id="reqNumber">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="8"/></svg> At least one number
                            </li>
                            <li class="req-item" id="reqSpecial">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="8"/></svg> At least one special character (!@#$%^&*)
                            </li>
                        </ul>
                    </div>
                </div>
                
                <div class="form-group" style="margin-bottom: var(--sp-6);">
                    <label for="confirmPassword" class="form-label">Confirm Password</label>
                    <div class="password-input-group">
                        <input type="password" id="confirmPassword" class="form-control" placeholder="Confirm new password" required>
                        <button type="button" class="password-toggle" onclick="togglePasswordVisibility('confirmPassword')" aria-label="Toggle password visibility">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
                        </button>
                    </div>
                </div>
                
                <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center;" id="resetBtn" disabled>
                    Update Password
                </button>
                
                <div style="text-align: center; margin-top: var(--sp-4);" id="backToLoginContainer">
                    <a href="login.html" style="font-size: var(--text-sm); color: var(--c-text-secondary); text-decoration: none; display: inline-flex; align-items: center; gap: 4px;">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
                        Back to Login
                    </a>
                </div>
            </form>
        </div>
        
        <div class="auth-footer">
            &copy; 2026 Shule Cafe. All rights reserved.
        </div>
    </div>

    <script type="module">
        import { AuthService } from './js/auth/auth-service.js';
        
        // Expose globally for inline onclick
        window.togglePasswordVisibility = function(id) {
            const el = document.getElementById(id);
            if(el) {
                const type = el.getAttribute('type') === 'password' ? 'text' : 'password';
                el.setAttribute('type', type);
            }
        };

        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('resetPasswordForm');
            const alert = document.getElementById('resetAlert');
            const resetBtn = document.getElementById('resetBtn');
            const newPasswordInput = document.getElementById('newPassword');
            const confirmPasswordInput = document.getElementById('confirmPassword');
            
            // Check if this is a "Force Password Change" flow
            const urlParams = new URLSearchParams(window.location.search);
            const isForceChange = urlParams.get('force') === 'true';
            
            if (isForceChange) {
                document.getElementById('pageTitle').textContent = 'Change Temporary Password';
                document.getElementById('pageSubtitle').textContent = 'For security reasons, you must change your password before continuing.';
                document.getElementById('currentPasswordGroup').style.display = 'block';
                document.getElementById('currentPassword').required = true;
                document.getElementById('backToLoginContainer').style.display = 'none'; // Don't allow going back without changing
            }
            
            // Password Strength Logic
            let isPasswordStrong = false;
            
            newPasswordInput.addEventListener('input', (e) => {
                const pwd = e.target.value;
                const result = AuthService.validatePasswordStrength(pwd);
                
                // Update UI reqs
                const checkIcon = '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>';
                const dotIcon = '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="8"/></svg>';
                
                const updateReq = (id, isValid) => {
                    const el = document.getElementById(id);
                    if(isValid) {
                        el.classList.add('met');
                        el.innerHTML = `${checkIcon} ${el.textContent}`;
                    } else {
                        el.classList.remove('met');
                        el.innerHTML = `${dotIcon} ${el.textContent}`;
                    }
                };
                
                updateReq('reqLength', result.hasLength);
                updateReq('reqUpperLower', result.hasUpper && result.hasLower);
                updateReq('reqNumber', result.hasNumber);
                updateReq('reqSpecial', result.hasSpecial);
                
                // Update segments
                const segments = [
                    document.getElementById('seg1'),
                    document.getElementById('seg2'),
                    document.getElementById('seg3'),
                    document.getElementById('seg4')
                ];
                
                segments.forEach(s => s.style.background = 'transparent');
                
                let strengthLabel = document.getElementById('strengthLabel');
                isPasswordStrong = result.score >= 4;
                
                if (pwd.length === 0) {
                    strengthLabel.textContent = 'Weak';
                    strengthLabel.style.color = 'inherit';
                } else if (result.score <= 1) {
                    segments[0].style.background = 'var(--c-danger)';
                    strengthLabel.textContent = 'Weak';
                    strengthLabel.style.color = 'var(--c-danger)';
                } else if (result.score === 2) {
                    segments[0].style.background = 'var(--c-warning)';
                    segments[1].style.background = 'var(--c-warning)';
                    strengthLabel.textContent = 'Fair';
                    strengthLabel.style.color = 'var(--c-warning)';
                } else if (result.score === 3) {
                    segments[0].style.background = 'var(--c-primary)';
                    segments[1].style.background = 'var(--c-primary)';
                    segments[2].style.background = 'var(--c-primary)';
                    strengthLabel.textContent = 'Good';
                    strengthLabel.style.color = 'var(--c-primary)';
                } else if (result.score >= 4) {
                    segments.forEach(s => s.style.background = 'var(--c-success)');
                    strengthLabel.textContent = 'Strong';
                    strengthLabel.style.color = 'var(--c-success)';
                }
                
                checkFormValidity();
            });
            
            confirmPasswordInput.addEventListener('input', checkFormValidity);
            
            function checkFormValidity() {
                const pwd = newPasswordInput.value;
                const confirm = confirmPasswordInput.value;
                
                if (isPasswordStrong && pwd === confirm && pwd !== '') {
                    resetBtn.disabled = false;
                    alert.style.display = 'none';
                } else {
                    resetBtn.disabled = true;
                }
            }
            
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const pwd = newPasswordInput.value;
                const confirm = confirmPasswordInput.value;
                
                if (pwd !== confirm) {
                    alert.textContent = 'Passwords do not match.';
                    alert.style.display = 'block';
                    return;
                }
                
                if (!isPasswordStrong) {
                    alert.textContent = 'Please choose a stronger password.';
                    alert.style.display = 'block';
                    return;
                }
                
                resetBtn.disabled = true;
                resetBtn.innerHTML = 'Updating...';
                
                try {
                    const currentPwd = isForceChange ? document.getElementById('currentPassword').value : null;
                    await AuthService.resetPassword(currentPwd, pwd);
                    
                    alert.className = 'alert alert-success';
                    alert.textContent = 'Password updated successfully! Redirecting...';
                    alert.style.display = 'block';
                    
                    // Redirect to login or dashboard based on flow
                    setTimeout(() => {
                        if (isForceChange) {
                            // If they just logged in, they can go straight to workspace
                            // For demo purposes, we'll route to headmaster
                            AuthService.redirectBasedOnRole('headmaster');
                        } else {
                            window.location.href = 'login.html';
                        }
                    }, 1500);
                    
                } catch (error) {
                    alert.className = 'alert alert-danger';
                    alert.textContent = error.message || 'An error occurred. Please try again.';
                    alert.style.display = 'block';
                    resetBtn.disabled = false;
                    resetBtn.innerHTML = 'Update Password';
                }
            });
        });
    </script>
</body>
</html>
