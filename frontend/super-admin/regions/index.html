<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regional Offices ‹ Super Admin ‹ SHULE CAFE</title>
    
    <link rel="stylesheet" href="../../css/design-system.css">
    <link rel="stylesheet" href="../../css/layout.css">
    <link rel="stylesheet" href="../../css/super-admin-theme.css">
    
    <script type="module" src="../../layouts/global-layout.js"></script>
    <script type="module" src="../../js/auth/auth-guard.js"></script>
</head>
<body>
    <div class="app-layout">
        <app-sidebar role="super_admin" active-path="/super-admin/regions/index.html"></app-sidebar>
        
        <div class="app-main">
            <app-topbar username="System Administrator"></app-topbar>
            
            <main class="app-content-wrapper">
                <div class="app-content" style="padding: 0;">
                    <div style="margin-bottom: 6px;">
                        <app-breadcrumb path="Super Admin, Regional Offices"></app-breadcrumb>
                    </div>
                    
                    <!-- Single-Row Compact Header Card -->
                    <div class="card" style="margin-bottom: 8px; padding: 6px 14px; background: white; border-radius: 8px; border: 1.5px solid var(--sa-grid-border); box-shadow: 0 1px 2px rgba(0,0,0,0.03); display: flex; align-items: center; justify-content: space-between;">
                        <div style="display: flex; align-items: center; gap: 8px;">
                            <div style="width: 26px; height: 26px; border-radius: 6px; background: var(--sa-primary); color: white; display: flex; align-items: center; justify-content: center;">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg>
                            </div>
                            <h2 style="margin: 0; font-size: 14px; font-weight: 800; color: var(--c-text-primary);">Regional Offices Management</h2>
                        </div>
                        <button id="addOfficerBtn" class="btn btn-primary btn-sm" style="font-weight: 700; display: inline-flex; align-items: center; gap: 6px;">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                            Add Regional Officer
                        </button>
                    </div>
                    
                    <div class="card" style="padding: 0; background: white; border-radius: 10px; border: 1px solid #e2e8f0; overflow: hidden;">
                        <app-table-toolbar search-placeholder="Search regions or officers..."></app-table-toolbar>
                        
                        <div id="tableContainer" style="padding: 10px 14px;"></div>
                    </div>
                </div>
                <app-footer></app-footer>
            </main>
        </div>
    </div>

    <!-- Add Officer Modal -->
    <div id="addOfficerModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 9999; align-items: center; justify-content: center;">
        <div class="card" style="width: 100%; max-width: 450px; padding: var(--sp-6); background: white;">
            <h3 style="margin-top: 0; margin-bottom: var(--sp-4);">Add Regional Education Officer</h3>
            
            <div id="modalAlert" class="alert alert-danger" style="display: none; margin-bottom: var(--sp-4);"></div>

            <form id="addOfficerForm">
                <div class="form-group" style="margin-bottom: var(--sp-4);">
                    <label class="form-label">Full Name <span style="color:var(--c-danger);">*</span></label>
                    <input type="text" id="off_name" class="form-control" placeholder="e.g. Hon. Juma Ali" required>
                </div>
                <div class="form-group" style="margin-bottom: var(--sp-4);">
                    <label class="form-label">Assigned Region <span style="color:var(--c-danger);">*</span></label>
                    <select id="off_region" class="form-control" required>
                        <option value="MJINI MAGHARIBI">Mjini Magharibi (MM)</option>
                        <option value="DAR ES SALAAM">Dar es Salaam (DAR)</option>
                        <option value="ARUSHA">Arusha (ARU)</option>
                        <option value="DODOMA">Dodoma (DOD)</option>
                        <option value="MWANZA">Mwanza (MWZ)</option>
                        <option value="KILIMANJARO">Kilimanjaro (KIL)</option>
                        <option value="MBEYA">Mbeya (MBY)</option>
                        <option value="MOROGORO">Morogoro (MOR)</option>
                        <option value="TANGA">Tanga (TAN)</option>
                        <option value="TABORA">Tabora (TAB)</option>
                        <option value="KIGOMA">Kigoma (KIG)</option>
                        <option value="SHINYANGA">Shinyanga (SHY)</option>
                        <option value="KAGERA">Kagera (KAG)</option>
                        <option value="MARA">Mara (MAR)</option>
                        <option value="MANYARA">Manyara (MAN)</option>
                        <option value="SINGIDA">Singida (SNG)</option>
                        <option value="PWANI">Pwani (PWN)</option>
                        <option value="KASKAZINI UNGUJA">Kaskazini Unguja (KU)</option>
                        <option value="KUSINI UNGUJA">Kusini Unguja (SU)</option>
                        <option value="KASKAZINI PEMBA">Kaskazini Pemba (KP)</option>
                        <option value="KUSINI PEMBA">Kusini Pemba (SP)</option>
                    </select>
                </div>
                <div class="form-group" style="margin-bottom: var(--sp-4);">
                    <label class="form-label">Phone Number (Username) <span style="color:var(--c-danger);">*</span></label>
                    <input type="text" id="off_phone" class="form-control" placeholder="e.g. +255755000111" required>
                </div>
                <div class="form-group" style="margin-bottom: var(--sp-6);">
                    <label class="form-label">Password <span style="color:var(--c-danger);">*</span></label>
                    <input type="password" id="off_password" class="form-control" placeholder="Set password" required>
                </div>
                <div style="display: flex; gap: var(--sp-2); justify-content: flex-end;">
                    <button type="button" id="closeModalBtn" class="btn btn-outline">Cancel</button>
                    <button type="submit" id="saveOfficerBtn" class="btn btn-primary">Save Officer</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const tableContainer = document.getElementById('tableContainer');
            const modal = document.getElementById('addOfficerModal');
            const form = document.getElementById('addOfficerForm');
            const modalAlert = document.getElementById('modalAlert');
            const saveBtn = document.getElementById('saveOfficerBtn');
            const closeBtn = document.getElementById('closeModalBtn');
            
            // Listen for primary action button click from page header
            document.addEventListener('click', (e) => {
                if (e.target.closest('#pageHeader button') || e.target.closest('[primary-action]')) {
                    modal.style.display = 'flex';
                }
            });

            closeBtn.addEventListener('click', () => {
                modal.style.display = 'none';
            });

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                modalAlert.style.display = 'none';

                const data = {
                    full_name: document.getElementById('off_name').value,
                    region: document.getElementById('off_region').value,
                    phone: document.getElementById('off_phone').value,
                    password: document.getElementById('off_password').value
                };

                saveBtn.disabled = true;
                saveBtn.textContent = 'Saving...';

                try {
                    const res = await fetch('/shule-cafe/api/regional/create.php', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        credentials: 'include',
                        body: JSON.stringify(data)
                    });

                    const result = await res.json();
                    if (res.ok && result.success) {
                        modal.style.display = 'none';
                        form.reset();
                        window.location.reload();
                    } else {
                        modalAlert.textContent = result.message || 'Error creating officer.';
                        modalAlert.style.display = 'block';
                        saveBtn.disabled = false;
                        saveBtn.textContent = 'Save Officer';
                    }
                } catch (err) {
                    modalAlert.textContent = 'Network error saving officer.';
                    modalAlert.style.display = 'block';
                    saveBtn.disabled = false;
                    saveBtn.textContent = 'Save Officer';
                }
            });

            const columns = [
                { key: 'user', label: 'Regional Officer Name', type: 'avatar' },
                { key: 'user_code', label: 'Shule Cafe ID', type: 'badge' },
                { key: 'region', label: 'Assigned Region', type: 'text' },
                { key: 'phone', label: 'Phone Number', type: 'text' },
                { key: 'status', label: 'Status', type: 'status' }
            ];

            try {
                const res = await fetch('/shule-cafe/api/regional/list.php', { credentials: 'include' });
                const result = await res.json();

                if (res.ok && result.success && result.data && result.data.length > 0) {
                    const regionsData = result.data.map(item => ({
                        id: item.id,
                        user: { initials: item.full_name ? item.full_name.charAt(0).toUpperCase() : 'O', name: item.full_name },
                        user_code: item.user_code || 'N/A',
                        region: item.region || 'Mjini Magharibi',
                        phone: item.phone || 'N/A',
                        status: item.status === 'active' ? 'Active' : 'Suspended'
                    }));

                    const appTable = document.createElement('app-table');
                    appTable.setAttribute('columns', JSON.stringify(columns));
                    appTable.setAttribute('data', JSON.stringify(regionsData));
                    appTable.setAttribute('entity-url', 'workspace.html');
                    appTable.setAttribute('actions', 'view');
                    
                    tableContainer.innerHTML = '';
                    tableContainer.appendChild(appTable);
                } else {
                    tableContainer.innerHTML = '<app-table-empty title="No Regional Officers" message="No regional education officers registered yet. Click \'Add Regional Officer\' above to register an officer."></app-table-empty>';
                }
            } catch (err) {
                tableContainer.innerHTML = '<app-table-empty title="No Regional Officers Found" message="Unable to load regional offices."></app-table-empty>';
            }
        });
    </script>
</body>
</html>
