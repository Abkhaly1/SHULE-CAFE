<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Workspace Demo ‹ SHULE CAFE</title>
    
    <!-- Design System & Base Layout CSS -->
    <link rel="stylesheet" href="css/design-system.css">
    <link rel="stylesheet" href="css/layout.css">
    
    <!-- Global Layout Web Components (includes workspace) -->
    <script type="module" src="layouts/global-layout.js"></script>
</head>
<body>
    <div class="app-layout">
        
        <!-- Sidebar Component -->
        <app-sidebar role="tenant_admin" active-path="/headmaster/students.html"></app-sidebar>
        
        <!-- Main Area -->
        <div class="app-main">
            
            <!-- Topbar Component -->
            <app-topbar username="Headmaster Demo"></app-topbar>
            
            <!-- Content Area -->
            <main class="app-content-wrapper">
                <div class="app-content">
                    
                    <!-- Breadcrumb Component -->
                    <app-breadcrumb path="Dashboard, Students, Ahmed Ali"></app-breadcrumb>
                    
                    <!-- Universal Workspace Architecture -->
                    <app-workspace-layout back-url="#" back-label="Back to Students">
                        
                        <!-- Workspace Header -->
                        <app-workspace-header 
                            avatar-text="AA" 
                            title="Ahmed Ali" 
                            subtitle="Form 1A • Student ID: STD-001" 
                            status="Active" 
                            status-color="success">
                            <!-- Quick Metadata injected -->
                            <div>
                                <div style="color: var(--c-text-muted); font-size: var(--text-sm);">Parent/Guardian</div>
                                <div style="font-weight: 500;">Fatma Juma</div>
                            </div>
                        </app-workspace-header>

                        <!-- Workspace Summary -->
                        <app-workspace-summary>
                            <app-workspace-summary-card title="Overall Grade" value="B+" icon="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"></app-workspace-summary-card>
                            <app-workspace-summary-card title="Attendance" value="98%" icon="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"></app-workspace-summary-card>
                            <app-workspace-summary-card title="Demerits" value="0" icon="M12 2L1 21h22M12 6l7.53 13H4.47M11 10v4h2v-4m-2 6v2h2v-2"></app-workspace-summary-card>
                        </app-workspace-summary>

                        <!-- Workspace Tabs -->
                        <!-- Data attribute passed as JSON string -->
                        <app-workspace-tabs active-tab="overview" tabs='[
                            {"id": "overview", "label": "Overview"},
                            {"id": "grades", "label": "Grades"},
                            {"id": "attendance", "label": "Attendance"},
                            {"id": "documents", "label": "Documents"},
                            {"id": "settings", "label": "Settings"}
                        ]'></app-workspace-tabs>

                        <!-- Workspace Content Area -->
                        <app-workspace-content default-tab="overview">
                            
                            <!-- Tab: Overview -->
                            <div data-tab-content="overview">
                                <div class="card" style="padding: var(--sp-4);">
                                    <h3 style="margin-bottom: var(--sp-4);">Student Overview</h3>
                                    <p>Ahmed is a highly motivated student. His performance in mathematics is exceptional.</p>
                                    
                                    <!-- Embedded Workspace Toolbar for internal lists -->
                                    <app-workspace-toolbar search-placeholder="Search activities..." show-filters="false" primary-action="Log Activity"></app-workspace-toolbar>
                                    
                                    <div class="empty-state" style="padding: var(--sp-6); text-align: center; border: 1px dashed var(--c-border-light);">
                                        <p style="color: var(--c-text-muted);">No recent activities logged.</p>
                                    </div>
                                </div>
                            </div>

                            <!-- Tab: Grades (Simulates Loading State) -->
                            <div data-tab-content="grades">
                                <app-workspace-loading></app-workspace-loading>
                            </div>

                            <!-- Tab: Attendance (Simulates Empty State) -->
                            <div data-tab-content="attendance">
                                <app-workspace-empty title="No Attendance Records" message="No attendance data has been logged for this student yet." action="Mark Attendance"></app-workspace-empty>
                            </div>

                            <!-- Tab: Documents (Simulates Error State) -->
                            <div data-tab-content="documents">
                                <app-workspace-error title="Confidential" message="You do not have permission to view this student's confidential documents."></app-workspace-error>
                            </div>

                            <!-- Tab: Settings -->
                            <div data-tab-content="settings">
                                <div class="card" style="padding: var(--sp-4);">
                                    <h3>Account Settings</h3>
                                    <p class="text-muted">Manage Ahmed's account access.</p>
                                    <button class="btn btn-primary" style="margin-top: var(--sp-4);">Reset Password</button>
                                </div>
                            </div>

                        </app-workspace-content>
                        
                    </app-workspace-layout>

                </div>
                
                <!-- Footer Component -->
                <app-footer></app-footer>
                
            </main>
        </div>
    </div>
</body>
</html>
