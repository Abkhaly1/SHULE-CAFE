<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Class ‹ Headmaster ‹ SHULE CAFE</title>
    <link rel="stylesheet" href="../css/design-system.css">
    <link rel="stylesheet" href="../css/layout.css">
</head>
<body>
    <div class="app-layout">
        <!-- Sidebar -->
        <aside class="app-sidebar" id="sidebar">
            <div class="sidebar-brand">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>
                <span>SHULE CAFE</span>
            </div>
            <nav class="sidebar-nav">
                <ul>
                    <li><a href="dashboard.html">
                        <svg class="nav-icon" viewBox="0 0 24 24"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>
                        <span>Dashboard</span>
                    </a></li>
                    <li><a href="teachers.html">
                        <svg class="nav-icon" viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
                        <span>Teachers</span>
                    </a></li>
                    <li><a href="#">
                        <svg class="nav-icon" viewBox="0 0 24 24"><path d="M12 3L1 9l11 6 9-4.91V17h2V9L12 3z M5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82z"/></svg>
                        <span>Students</span>
                    </a></li>
                    <li><a href="classes.html" class="active">
                        <svg class="nav-icon" viewBox="0 0 24 24"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-1 9H9V9h10v2zm-4 4H9v-2h6v2zm4-8H9V5h10v2z"/></svg>
                        <span>Classes</span>
                    </a></li>
                </ul>
            </nav>
        </aside>

        <!-- Main Area -->
        <div class="app-main">
            <!-- Topbar -->
            <header class="app-topbar">
                <div class="topbar-left">
                    <button class="topbar-btn" id="toggleSidebar">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
                    </button>
                    <span style="font-weight: 500;">Headmaster Panel</span>
                </div>
                <div class="topbar-right">
                    <a href="../login.html" class="topbar-btn" style="color: var(--c-danger-text);">Logout</a>
                </div>
            </header>

            <!-- Content Area -->
            <main class="app-content-wrapper">
                <div class="app-content">
                    
                    <div class="breadcrumb">
                        <a href="classes.html" class="breadcrumb-link">Classes</a>
                        <span class="breadcrumb-separator">/</span>
                        <span class="breadcrumb-item">Add New Class</span>
                    </div>

                    <div class="page-header-wrapper" style="margin-top: var(--sp-2);">
                        <div class="page-header-left">
                            <h1>Create New Class</h1>
                        </div>
                    </div>

                    <!-- Error/Success Alerts -->
                    <div id="formAlert" class="alert alert-error" style="display: none; margin-bottom: var(--sp-4);">
                        <div class="alert-content">
                            <strong id="formAlertTitle">Error!</strong>
                            <p id="formAlertMsg"></p>
                        </div>
                    </div>

                    <div class="card" style="max-width: 600px;">
                        <div class="card-body">
                            <form id="addClassForm">
                                
                                <div class="form-group">
                                    <label class="form-label">Class Name *</label>
                                    <input type="text" id="class_name" class="form-control" placeholder="e.g. Form One, Grade 1" required>
                                </div>
                                
                                <div style="margin-top: var(--sp-6); border-top: 1px solid var(--c-border-light); padding-top: var(--sp-4);">
                                    <button type="submit" id="submitBtn" class="btn btn-primary">Save Class</button>
                                    <a href="classes.html" class="btn btn-outline" style="text-decoration: none;">Cancel</a>
                                </div>
                            </form>
                        </div>
                    </div>

                </div>
            </main>
        </div>
    </div>

    <!-- JS -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('addClassForm');
            const alertBox = document.getElementById('formAlert');
            const alertTitle = document.getElementById('formAlertTitle');
            const alertMsg = document.getElementById('formAlertMsg');
            const submitBtn = document.getElementById('submitBtn');

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                alertBox.style.display = 'none';

                const data = {
                    name: document.getElementById('class_name').value
                };

                const originalBtnText = submitBtn.textContent;
                submitBtn.classList.add('btn-loading');
                submitBtn.disabled = true;
                submitBtn.textContent = 'Saving...';

                try {
                    const res = await fetch('/shule-cafe/api/classes/create.php', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        credentials: 'include',
                        body: JSON.stringify(data)
                    });
                    
                    const result = await res.json();
                    
                    if (res.ok && result.success) {
                        alertBox.className = 'alert alert-success';
                        alertTitle.textContent = 'Success!';
                        alertMsg.textContent = result.message;
                        alertBox.style.display = 'flex';
                        
                        form.reset();
                        
                        setTimeout(() => {
                            window.location.href = 'classes.html';
                        }, 1500);
                    } else {
                        alertBox.className = 'alert alert-error';
                        alertTitle.textContent = 'Error!';
                        alertMsg.textContent = result.message || "Failed to create class.";
                        alertBox.style.display = 'flex';
                    }
                } catch (error) {
                    alertBox.className = 'alert alert-error';
                    alertTitle.textContent = 'Error!';
                    alertMsg.textContent = "Network error occurred.";
                    alertBox.style.display = 'flex';
                } finally {
                    submitBtn.classList.remove('btn-loading');
                    submitBtn.disabled = false;
                    submitBtn.textContent = originalBtnText;
                }
            });
        });
    </script>
</body>
</html>
