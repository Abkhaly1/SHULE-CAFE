<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Students ‹ Headmaster ‹ SHULE CAFE</title>
    <link rel="stylesheet" href="../css/design-system.css">
    <link rel="stylesheet" href="../css/layout.css">
</head>
<body>
    <div class="app-layout">
        <!-- Sidebar -->
        <aside class="app-sidebar" id="sidebar">
            <div class="sidebar-brand">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>
                <span>SHULE CAFE</span>
            </div>
            <nav class="sidebar-nav">
                <ul>
                    <li><a href="dashboard.html">
                        <svg class="nav-icon" viewBox="0 0 24 24"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>
                        <span>Dashboard</span>
                    </a></li>
                    <li><a href="teachers.html">
                        <svg class="nav-icon" viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
                        <span>Teachers</span>
                    </a></li>
                    <li><a href="students.html" class="active">
                        <svg class="nav-icon" viewBox="0 0 24 24"><path d="M12 3L1 9l11 6 9-4.91V17h2V9L12 3z M5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82z"/></svg>
                        <span>Students</span>
                    </a></li>
                    <li><a href="classes.html">
                        <svg class="nav-icon" viewBox="0 0 24 24"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-1 9H9V9h10v2zm-4 4H9v-2h6v2zm4-8H9V5h10v2z"/></svg>
                        <span>Classes</span>
                    </a></li>
                    <li><a href="subjects.html">
                        <svg class="nav-icon" viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
                        <span>Subjects</span>
                    </a></li>
                </ul>
            </nav>
        </aside>

        <!-- Main Area -->
        <div class="app-main">
            <!-- Topbar -->
            <header class="app-topbar">
                <div class="topbar-left">
                    <button class="topbar-btn" id="toggleSidebar">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
                    </button>
                    <span style="font-weight: 500;">Headmaster Panel</span>
                </div>
                <div class="topbar-right">
                    <a href="../login.html" class="topbar-btn" style="color: var(--c-danger-text);">Logout</a>
                </div>
            </header>

            <!-- Content Area -->
            <main class="app-content-wrapper">
                <div class="app-content">
                    
                    <div class="page-header-wrapper">
                        <div class="page-header-left">
                            <h1 style="display: flex; align-items: center; gap: var(--sp-4);">
                                Students
                                <a href="student-add.html" class="btn btn-primary btn-sm">Add New</a>
                            </h1>
                        </div>
                    </div>

                    <div class="table-wrapper">
                        <div class="table-toolbar" style="display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 16px;">
                            <div class="table-actions" style="display: flex; gap: 8px; align-items: center;">
                                <select class="form-select btn-sm" style="width:140px;">
                                    <option>Bulk Actions</option>
                                    <option>Suspend</option>
                                    <option>Transfer</option>
                                </select>
                                <button class="btn btn-outline btn-sm">Apply</button>
                            </div>
                            <div class="table-search-bar" style="display: flex; gap: 8px; align-items: center;">
                                <input type="text" id="searchInput" class="form-control btn-sm" placeholder="🔍 Search student name or reg code..." style="width:260px;">
                                <select id="limitSelect" class="form-select btn-sm" style="width:110px; font-weight:700;">
                                    <option value="25">25 / page</option>
                                    <option value="50">50 / page</option>
                                    <option value="100">100 / page</option>
                                </select>
                            </div>
                        </div>

                        <table class="table table-sticky">
                            <thead>
                                <tr>
                                    <th style="width: 40px;"><input type="checkbox" class="form-check-input" id="selectAll"></th>
                                    <th>Full Name</th>
                                    <th class="hide-mobile">Class</th>
                                    <th class="hide-mobile">Phone Number</th>
                                    <th>Status</th>
                                    <th class="hide-mobile" style="text-align: right;">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="studentsTableBody">
                                <tr>
                                    <td colspan="6" style="text-align: center; padding: var(--sp-6);">Loading students...</td>
                                </tr>
                            </tbody>
                        </table>

                        <!-- PAGINATION CONTROLS -->
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 18px; padding-top: 14px; border-top: 1px solid #e2e8f0; font-size: 13px;">
                            <div id="pageInfo" style="color: #64748b; font-weight: 600;">Showing 0 of 0 students</div>
                            <div style="display: flex; gap: 8px; align-items: center;">
                                <button type="button" id="prevBtn" class="btn btn-outline btn-sm" style="font-weight: 700;" disabled>&laquo; Previous</button>
                                <span id="pageSpan" style="padding: 6px 12px; background: #f1f5f9; border-radius: 6px; font-weight: 700; color: #0f172a;">Page 1 of 1</span>
                                <button type="button" id="nextBtn" class="btn btn-outline btn-sm" style="font-weight: 700;" disabled>Next &raquo;</button>
                            </div>
                        </div>
                    </div>

                </div>
            </main>
        </div>
    </div>

    <!-- JS -->
    <script>
        let state = { page: 1, limit: 25, search: '', totalPages: 1 };

        document.addEventListener('DOMContentLoaded', async () => {
            const toggleBtn = document.getElementById('toggleSidebar');
            const sidebar = document.getElementById('sidebar');
            if (toggleBtn && sidebar) {
                toggleBtn.addEventListener('click', () => {
                    sidebar.classList.toggle('collapsed');
                });
            }

            // Search listener
            let searchDebounce;
            document.getElementById('searchInput').addEventListener('input', (e) => {
                clearTimeout(searchDebounce);
                searchDebounce = setTimeout(() => {
                    state.search = e.target.value.trim();
                    state.page = 1;
                    loadStudents();
                }, 300);
            });

            // Limit listener
            document.getElementById('limitSelect').addEventListener('change', (e) => {
                state.limit = parseInt(e.target.value, 10);
                state.page = 1;
                loadStudents();
            });

            // Pagination Listeners
            document.getElementById('prevBtn').addEventListener('click', () => {
                if (state.page > 1) {
                    state.page--;
                    loadStudents();
                }
            });

            document.getElementById('nextBtn').addEventListener('click', () => {
                if (state.page < state.totalPages) {
                    state.page++;
                    loadStudents();
                }
            });

            loadStudents();
        });

        async function loadStudents() {
            const tbody = document.getElementById('studentsTableBody');
            tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; padding: var(--sp-6); color: #64748b;">Loading students...</td></tr>';

            try {
                const searchQ = encodeURIComponent(state.search);
                const res = await fetch(`/shule-cafe/api/students/list.php?page=${state.page}&limit=${state.limit}&search=${searchQ}`, { credentials: 'include' });
                
                if (res.status === 401 || res.status === 403) {
                    window.location.href = '../login.html';
                    return;
                }
                
                const data = await res.json();
                
                if (data.success) {
                    const students = data.data || [];
                    const pag = data.pagination || {};

                    state.totalPages = pag.total_pages || 1;
                    const startIdx = pag.total > 0 ? (state.page - 1) * state.limit + 1 : 0;
                    const endIdx = Math.min(pag.total, state.page * state.limit);

                    document.getElementById('pageInfo').textContent = `Showing ${startIdx} to ${endIdx} of ${pag.total} students`;
                    document.getElementById('pageSpan').textContent = `Page ${state.page} of ${state.totalPages}`;
                    document.getElementById('prevBtn').disabled = state.page <= 1;
                    document.getElementById('nextBtn').disabled = state.page >= state.totalPages;

                    if (students.length === 0) {
                        tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;">No students found matching criteria. <a href="student-add.html">Add one</a></td></tr>`;
                    } else {
                        tbody.innerHTML = '';
                        students.forEach(student => {
                            const tr = document.createElement('tr');
                            
                            let badgeClass = 'badge-inactive';
                            if (student.status === 'active') badgeClass = 'badge-active';
                            if (student.status === 'suspended') badgeClass = 'badge-suspended';

                            tr.innerHTML = `
                                <td><input type="checkbox" class="form-check-input row-select"></td>
                                <td>
                                    <a href="people/student_workspace.html?id=${student.id}" class="table-view-action" style="font-weight: 500; color: var(--c-primary-600); text-decoration: none;">${student.full_name}</a>
                                    <div style="font-size: var(--text-xs); color: var(--c-text-muted); margin-top: 2px;">ID: ${student.id.substring(0,8)}...</div>
                                </td>
                                <td class="hide-mobile">${student.class_name || '<span class="text-muted">Unassigned</span>'}</td>
                                <td class="hide-mobile">${student.phone}</td>
                                <td><span class="badge ${badgeClass}">${student.status.charAt(0).toUpperCase() + student.status.slice(1)}</span></td>
                                <td class="hide-mobile" style="text-align: right;">
                                    <a href="#" class="table-view-action">Manage</a>
                                </td>
                            `;
                            tbody.appendChild(tr);
                        });
                    }
                } else {
                    tbody.innerHTML = `<tr><td colspan="6" style="color:var(--c-danger-text); text-align:center;">${data.message}</td></tr>`;
                }
            } catch (error) {
                console.error(error);
                tbody.innerHTML = `<tr><td colspan="6" style="color:var(--c-danger-text); text-align:center;">Error loading data.</td></tr>`;
            }
        }
    </script>
</body>
</html>
