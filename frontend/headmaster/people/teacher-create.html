<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Teacher ‹ Headmaster ‹ SHULE CAFE</title>
    
    <link rel="stylesheet" href="../../css/design-system.css">
    <link rel="stylesheet" href="../../css/layout.css">
    
    <script type="module" src="../../layouts/global-layout.js"></script>
    <script type="module" src="../../js/auth/auth-guard.js"></script>
</head>
<body>
    <div class="app-layout">
        <app-sidebar role="tenant_admin" active-path="/headmaster/people/index.html"></app-sidebar>
        
        <div class="app-main">
            <app-topbar username="Headmaster Mlimani"></app-topbar>
            
            <main class="app-content-wrapper">
                <div class="app-content">
                    <app-breadcrumb path="Headmaster, People, Register Teacher"></app-breadcrumb>
                    
                    <app-page-header 
                        title="Register New Teacher" 
                        subtitle="Add a new teaching staff member to the school."
                        primary-action="Save & Register"
                        primary-url="teacher-workspace.html">
                    </app-page-header>
                    
                    <div style="display: grid; grid-template-columns: 2fr 1fr; gap: var(--sp-6); margin-top: var(--sp-6);">
                        
                        <!-- Left Column: Form -->
                        <div style="display: flex; flex-direction: column; gap: var(--sp-6);">
                            
                            <!-- Personal Details -->
                            <div class="card" style="padding: var(--sp-6);">
                                <h3 style="margin-top: 0; margin-bottom: var(--sp-4);">Personal Details</h3>
                                
                                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-4); margin-bottom: var(--sp-4);">
                                    <div class="form-group">
                                        <label class="form-label">First Name <span style="color:var(--c-danger);">*</span></label>
                                        <input type="text" class="form-control" placeholder="e.g. Moses">
                                    </div>
                                    <div class="form-group">
                                        <label class="form-label">Last Name <span style="color:var(--c-danger);">*</span></label>
                                        <input type="text" class="form-control" placeholder="e.g. Mushi">
                                    </div>
                                </div>
                                
                                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-4); margin-bottom: var(--sp-4);">
                                    <div class="form-group">
                                        <label class="form-label">Gender <span style="color:var(--c-danger);">*</span></label>
                                        <select class="form-select">
                                            <option value="">Select Gender</option>
                                            <option value="F">Female</option>
                                            <option value="M">Male</option>
                                        </select>
                                    </div>
                                    <div class="form-group">
                                        <label class="form-label">Phone Number</label>
                                        <input type="text" class="form-control" placeholder="e.g. 0700 123 456">
                                    </div>
                                </div>
                                
                                <div class="form-group">
                                    <label class="form-label">Email Address (Optional)</label>
                                    <input type="email" class="form-control" placeholder="e.g. moses@example.com">
                                </div>
                            </div>
                            
                            <!-- Employment Details -->
                            <div class="card" style="padding: var(--sp-6);">
                                <h3 style="margin-top: 0; margin-bottom: var(--sp-4);">Employment Details</h3>
                                
                                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-4); margin-bottom: var(--sp-4);">
                                    <div class="form-group">
                                        <label class="form-label">Department</label>
                                        <select class="form-select">
                                            <option value="">Select Department</option>
                                            <option value="math">Mathematics</option>
                                            <option value="science">Sciences</option>
                                            <option value="language">Languages</option>
                                        </select>
                                    </div>
                                    <div class="form-group">
                                        <label class="form-label">Employment Type <span style="color:var(--c-danger);">*</span></label>
                                        <select class="form-select">
                                            <option value="full">Full-Time</option>
                                            <option value="part">Part-Time</option>
                                        </select>
                                    </div>
                                </div>
                                
                                <div class="form-group">
                                    <label class="form-label">Teacher ID (Manual)</label>
                                    <input type="text" class="form-control" placeholder="Leave blank to auto-generate">
                                </div>
                            </div>
                        </div>
                        
                        <!-- Right Column: System Info -->
                        <div style="display: flex; flex-direction: column; gap: var(--sp-6);">
                            
                            <div class="card" style="padding: var(--sp-6); background: var(--c-bg-page);">
                                <h4 style="margin-top: 0; font-size: var(--text-sm); display: flex; align-items: center; gap: 8px; color: var(--c-text-secondary);">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
                                    Account Generation
                                </h4>
                                <p style="font-size: var(--text-sm); color: var(--c-text-muted); margin: 0 0 var(--sp-4) 0; line-height: 1.5;">
                                    Upon saving, a teacher account will be automatically generated.
                                </p>
                                <ul style="list-style: none; padding: 0; margin: 0; font-size: var(--text-sm); color: var(--c-text-secondary);">
                                    <li style="margin-bottom: 4px;">• Username: Email (or Surname if no email)</li>
                                    <li style="margin-bottom: 4px;">• Password: [Teacher ID]</li>
                                    <li style="margin-bottom: 4px;">• School ID: Auto-assigned</li>
                                </ul>
                            </div>
                            
                        </div>
                    </div>
                </div>
                <app-footer></app-footer>
            </main>
        </div>
    </div>
</body>
</html>
