    <!-- Multi-Page Sheet Wrapper -->
    <div class="pages-wrapper" id="transcriptPagesWrapper">
        <div style="text-align:center; padding: 40px; color: #64748b; font-weight: 700;">
            Loading official student transcript and performance trends...
        </div>
    </div>

    <!-- MAIN TRANSCRIPT GENERATION ENGINE -->
    <script>
        let reportData = null;
        let chartInstances = {};

        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const studentId = urlParams.get('student_id') || '';
            const year = urlParams.get('year') || '2026';

            if (!studentId) {
                document.getElementById('transcriptPagesWrapper').innerHTML = `
                    <div style="text-align:center; color:#dc2626; padding:30px; font-weight:700; background:white; border-radius:8px;">
                        No student ID specified in query parameters.
                    </div>
                `;
                return;
            }

            try {
                const res = await fetch(`/shule-cafe/api/headmaster/analytics/analytics_api.php?action=student_report_card&student_id=${encodeURIComponent(studentId)}&year=${encodeURIComponent(year)}`, {
                    credentials: 'include'
                });
                
                const rawText = await res.text();
                let data = null;
                try {
                    data = JSON.parse(rawText);
                } catch (parseErr) {
                    throw new Error("Invalid server response: " + rawText.substring(0, 150));
                }

                if (res.ok && data.success) {
                    reportData = data;
                    renderAllTranscriptPages(data);
                } else {
                    document.getElementById('transcriptPagesWrapper').innerHTML = `
                        <div style="text-align:center; color:#dc2626; padding:30px; font-weight:700; background:white; border-radius:8px; border:1px solid #fee2e2;">
                            <div style="font-size:16px; margin-bottom:6px;">Error Loading Transcript</div>
                            <div style="font-size:13px; color:#64748b;">${data.message || 'Unable to retrieve student transcript.'}</div>
                            <button class="btn btn-outline btn-sm" onclick="location.reload()" style="margin-top:14px;">Retry</button>
                        </div>
                    `;
                }
            } catch (e) {
                document.getElementById('transcriptPagesWrapper').innerHTML = `
                    <div style="text-align:center; color:#dc2626; padding:30px; font-weight:700; background:white; border-radius:8px; border:1px solid #fee2e2;">
                        <div style="font-size:16px; margin-bottom:6px;">Communication Error</div>
                        <div style="font-size:13px; color:#64748b;">${e.message || 'Network communication error while loading transcript.'}</div>
                        <button class="btn btn-outline btn-sm" onclick="location.reload()" style="margin-top:14px;">Retry</button>
                    </div>
                `;
            }
        });

        function renderAllTranscriptPages(data) {
            const wrapper = document.getElementById('transcriptPagesWrapper');
            wrapper.innerHTML = '';

            const t1 = data.term1_results || {};
            const t2 = data.term2_results || {};
            const hasT1 = t1.has_marks || (t1.subjects && t1.subjects.length > 0);
            const hasT2 = t2.has_marks || (t2.subjects && t2.subjects.length > 0);

            // PAGE 1: TERM 1 OFFICIAL REPORT CARD (If student has Term 1 marks or as first page)
            if (hasT1 || (!hasT1 && !hasT2)) {
                const p1 = createTermPageElement(data, 'Term 1', t1, 1);
                wrapper.appendChild(p1);
            }

            // PAGE 2: TERM 2 OFFICIAL REPORT CARD (If student has Term 2 marks)
            if (hasT2) {
                const p2 = createTermPageElement(data, 'Term 2', t2, 2);
                wrapper.appendChild(p2);
            }

            // FINAL PAGE: ANNUAL CUMULATIVE TRANSCRIPT & GRAPHICAL ANALYSIS OF RESULTS TRENDS
            const pFinal = createFinalTrendsPageElement(data);
            wrapper.appendChild(pFinal);

            // Render Charts after DOM elements are fully attached
            renderTrendsCharts(data);
        }

        /**
         * GENERATES A SINGLE OFFICIAL TERM TRANSCRIPT PAGE (A4 SHEET)
         */
        function createTermPageElement(data, termName, termData, pageNum) {
            const stu = data.student || {};
            const sch = data.school || {};
            const lvl = data.level_type || 'O-Level';
            const subs = termData.subjects || [];
            const sum = termData.summary || {};
            const isTerm1 = termName === 'Term 1';
            const termTitleBadge = isTerm1 ? 'FIRST TERM OFFICIAL ACADEMIC PROGRESS REPORT & SCORE SHEET' : 'SECOND TERM OFFICIAL ACADEMIC PROGRESS REPORT & SCORE SHEET';
            const thClass = isTerm1 ? 'th-t1' : 'th-t2';
            const accentColor = isTerm1 ? '#065f46' : '#1e40af';
            const conduct = termData.conduct_comment || 'Demonstrates good behavior and consistent academic effort.';
            const today = new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });

            let rowsHtml = '';
            subs.forEach((s, idx) => {
                rowsHtml += `
                    <tr>
                        <td style="font-weight:700; color:#64748b; text-align:center; width:28px;">${idx + 1}</td>
                        <td style="font-weight:800; color:#0f172a; width:65px;">${s.subject_code}</td>
                        <td style="font-weight:700; color:#334155;">${s.subject_name}</td>
                        <td style="text-align:center; font-weight:900; color:${accentColor}; width:85px;">${s.score}%</td>
                        <td style="text-align:center; width:50px;"><span class="grade-badge grade-${s.grade}">${s.grade}</span></td>
                        <td style="text-align:center; font-weight:800; width:45px;">${s.points}</td>
                        <td style="font-size:10px; color:#475569; font-style:italic;">${s.remark || 'Good Progress'}</td>
                    </tr>
                `;
            });

            if (subs.length === 0) {
                rowsHtml = `<tr><td colspan="7" style="text-align:center; padding:18px; color:#64748b;">No recorded marks found for ${termName}.</td></tr>`;
            }

            const pageDiv = document.createElement('div');

                return `
                    <span>A: 80–100% (1 Pt)</span>
                    <span>B: 70–79% (2 Pts)</span>
                    <span>C: 60–69% (3 Pts)</span>
                    <span>D: 50–59% (4 Pts)</span>
                    <span>E: 40–49% (5 Pts)</span>
                    <span>S: 35–39% (6 Pts)</span>
                    <span>F: 0–34% (7 Pts)</span>
                    <span style="color:#064e3b;font-weight:800;">• Principal Combination Key</span>
                `;
            } else {
                return `
                    <span>A: 75–100% (Excellent / 1 Pt)</span>
                    <span>B: 65–74% (Very Good / 2 Pts)</span>
                    <span>C: 45–64% (Good / 3 Pts)</span>
                    <span>D: 30–44% (Satisfactory / 4 Pts)</span>
                    <span>F: 0–29% (Fail / 5 Pts)</span>
                    <span style="color:#064e3b;font-weight:800;">• Top 7 Best Subjects NECTA Standard</span>
                `;
            }
        }

        /* ── FILTER PAGE VIEWS (TOOLBAR TOGGLE) ───────────────────────── */
        function filterPageViews(viewMode) {
            const p1 = document.getElementById('page-term1');
            const p2 = document.getElementById('page-term2');
            const pTrends = document.getElementById('page-trends');

            if (p1) p1.style.display = (viewMode === 'all' || viewMode === 'term1') ? 'flex' : 'none';
            if (p2) p2.style.display = (viewMode === 'all' || viewMode === 'term2') ? 'flex' : 'none';
            if (pTrends) pTrends.style.display = (viewMode === 'all' || viewMode === 'trends') ? 'flex' : 'none';

            if (viewMode === 'all' || viewMode === 'trends') {
                if (reportData) renderTrendsCharts(reportData);
            }
        }

        /* ── SWITCH DENSITY SCALING ───────────────────────────────────── */
        function switchDensity(densityClass) {
            document.body.classList.remove('density-compact', 'density-normal', 'density-relaxed');
            document.body.classList.add(densityClass);
            if (reportData) renderTrendsCharts(reportData);
        }
    </script>
</body>
</html>
