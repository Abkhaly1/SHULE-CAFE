<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regional Dashboard ‹ SHULE CAFE</title>
    
    <link rel="stylesheet" href="../css/design-system.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/regional-theme.css">
    
    <script type="module" src="../layouts/global-layout.js"></script>
    <script type="module" src="../js/auth/auth-guard.js"></script>
</head>
<body>
    <div class="app-layout">
        <app-sidebar role="regional_officer" active-path="/regional/dashboard.html"></app-sidebar>
        
        <div class="app-main">
            <app-topbar username="Regional Officer Portal"></app-topbar>
            
            <main class="app-content-wrapper">
                <div class="app-content" style="padding: 0;">
                    <div style="margin-bottom: 6px;">
                        <app-breadcrumb path="Regional Officer, Dashboard"></app-breadcrumb>
                    </div>
                    
                    <!-- Single-Row Compact Header per PAGE_RULES.md -->
                    <div class="card" style="margin-bottom: 12px; padding: 6px 14px; background: white; border-radius: 8px; border: 1px solid var(--c-primary-border); box-shadow: 0 1px 2px rgba(0,0,0,0.03); display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;">
                        <div style="display: flex; align-items: center; gap: 8px;">
                            <div style="width: 26px; height: 26px; border-radius: 6px; background: var(--c-primary); color: white; display: flex; align-items: center; justify-content: center;">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <circle cx="12" cy="12" r="10"/>
                                    <line x1="2" y1="12" x2="22" y2="12"/>
                                    <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
                                </svg>
                            </div>
                            <h2 style="margin: 0; font-size: 14px; font-weight: 800; color: var(--c-text-primary);">Regional Overview & Jurisdiction</h2>
                        </div>
                        <div style="display: flex; align-items: center; gap: 8px;">
                            <span class="badge" style="background: #eff6ff; color: #1d4ed8; font-weight: 800; font-size: 11px; padding: 4px 10px; border-radius: 6px; border: 1px solid #bfdbfe;">Regional Inspectorate</span>
                        </div>
                    </div>
                    
                    <!-- Standardized KPI Stats Cards per PAGE_RULES.md -->
                    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; margin-bottom: 14px;">
                        <div class="card" style="padding: 14px 16px; border-radius: 10px; border: 1px solid var(--c-border-light); border-left: 4px solid #4338ca; display: flex; justify-content: space-between; align-items: center; background: white;">
                            <div>
                                <div style="font-size: 11px; font-weight: 800; color: var(--c-text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px;">Registered Schools</div>
                                <div style="font-size: 24px; font-weight: 800; color: var(--c-text-primary);" id="statSchools">0</div>
                            </div>
                            <div style="width: 36px; height: 36px; border-radius: 8px; background: #e0e7ff; color: #4338ca; display: flex; align-items: center; justify-content: center;">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                            </div>
                        </div>
                        <div class="card" style="padding: 14px 16px; border-radius: 10px; border: 1px solid var(--c-border-light); border-left: 4px solid #0369a1; display: flex; justify-content: space-between; align-items: center; background: white;">
                            <div>
                                <div style="font-size: 11px; font-weight: 800; color: var(--c-text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px;">Total Teachers</div>
                                <div style="font-size: 24px; font-weight: 800; color: var(--c-text-primary);" id="statTeachers">0</div>
                            </div>
                            <div style="width: 36px; height: 36px; border-radius: 8px; background: #e0f2fe; color: #0369a1; display: flex; align-items: center; justify-content: center;">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                            </div>
                        </div>
                        <div class="card" style="padding: 14px 16px; border-radius: 10px; border: 1px solid var(--c-border-light); border-left: 4px solid #15803d; display: flex; justify-content: space-between; align-items: center; background: white;">
                            <div>
                                <div style="font-size: 11px; font-weight: 800; color: var(--c-text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px;">Total Students</div>
                                <div style="font-size: 24px; font-weight: 800; color: var(--c-text-primary);" id="statStudents">0</div>
                            </div>
                            <div style="width: 36px; height: 36px; border-radius: 8px; background: #dcfce7; color: #15803d; display: flex; align-items: center; justify-content: center;">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>
                            </div>
                        </div>
                        <div class="card" style="padding: 14px 16px; border-radius: 10px; border: 1px solid var(--c-border-light); border-left: 4px solid #b45309; display: flex; justify-content: space-between; align-items: center; background: white;">
                            <div>
                                <div style="font-size: 11px; font-weight: 800; color: var(--c-text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px;">Total Parents</div>
                                <div style="font-size: 24px; font-weight: 800; color: var(--c-text-primary);" id="statParents">0</div>
                            </div>
                            <div style="width: 36px; height: 36px; border-radius: 8px; background: #fef3c7; color: #b45309; display: flex; align-items: center; justify-content: center;">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                            </div>
                        </div>
                    </div>

                    <!-- Regional Schools Table per PAGE_RULES.md -->
                    <div class="card" style="padding: 0; overflow: hidden; border: 1px solid var(--c-border-light); border-radius: 8px; margin-bottom: 14px;">
                        <div style="padding: 12px 16px; border-bottom: 1px solid var(--c-border-light); background: var(--c-surface-hover); display: flex; justify-content: space-between; align-items: center;">
                            <div style="font-weight: 800; font-size: 13px; color: var(--c-text-primary); display: flex; align-items: center; gap: 8px;">
                                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--c-primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                                <span>Schools Directory</span>
                            </div>
                        </div>
                        <div id="schoolsTableContainer" style="padding: 12px 16px;"></div>
                    </div>

                </div>
                <app-footer></app-footer>
            </main>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            // Load Stats
            try {
                const res = await fetch('/shule-cafe/api/stats/regional.php', { credentials: 'include' });
                if (res.status === 401 || res.status === 403) {
                    window.location.href = '/shule-cafe/frontend/auth/login.html';
                    return;
                }
                const data = await res.json();
                if (data.success && data.data) {
                    document.getElementById('statSchools').textContent = (data.data.schools || 0).toLocaleString();
                    document.getElementById('statTeachers').textContent = (data.data.teachers || 0).toLocaleString();
                    document.getElementById('statStudents').textContent = (data.data.students || 0).toLocaleString();
                    document.getElementById('statParents').textContent = (data.data.parents || 0).toLocaleString();
                }
            } catch (error) {
                console.error("Failed to load regional stats", error);
            }

            // Load Regional Schools
            try {
                const sRes = await fetch('/shule-cafe/api/schools/list.php', { credentials: 'include' });
                const sResult = await sRes.json();
                const container = document.getElementById('schoolsTableContainer');

                if (sRes.ok && sResult.success && sResult.data && sResult.data.length > 0) {
                    const cols = [
                        { key: 'school', label: 'School Name', type: 'avatar' },
                        { key: 'type', label: 'School Type', type: 'text' },
                        { key: 'region', label: 'Region', type: 'text' },
                        { key: 'status', label: 'Status', type: 'status' }
                    ];
                    const sData = sResult.data.map(item => ({
                        id: item.id,
                        school: { initials: item.name ? item.name.charAt(0).toUpperCase() : 'S', name: item.name },
                        type: item.type || 'Secondary',
                        region: item.region || 'N/A',
                        status: item.status === 'active' ? 'Active' : 'Suspended'
                    }));
                    const table = document.createElement('app-table');
                    table.setAttribute('columns', JSON.stringify(cols));
                    table.setAttribute('data', JSON.stringify(sData));
                    container.innerHTML = '';
                    container.appendChild(table);
                } else {
                    container.innerHTML = '<app-table-empty title="No Schools Registered" message="No schools registered in this region yet."></app-table-empty>';
                }
            } catch (e) {
                console.error("Failed to load schools", e);
                const container = document.getElementById('schoolsTableContainer');
                if (container) {
                    container.innerHTML = '<app-table-empty title="No Schools Found" message="Unable to load schools directory."></app-table-empty>';
                }
            }
        });
    </script>
</body>
</html>
