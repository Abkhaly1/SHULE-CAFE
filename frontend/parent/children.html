<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Children ‹ Parent Portal ‹ SHULE CAFE</title>
    <link rel="stylesheet" href="../css/design-system.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/parent-theme.css">
    <script type="module" src="../layouts/global-layout.js"></script>
    <script type="module" src="../js/auth/auth-guard.js"></script>
    <style>
        .child-card {
            background: #fff;
            border: 1px solid var(--c-border-light);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 4px 16px rgba(15, 23, 42, 0.04);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .child-card:hover {
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.07);
        }
        .child-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .child-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 16px;
        }
        .stat-block {
            background: var(--c-surface-hover, #f8fafc);
            border: 1px solid var(--c-border-light);
            border-radius: 8px;
            padding: 14px 16px;
        }
        .stat-label {
            font-size: 11px;
            font-weight: 800;
            color: var(--c-text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }
        .stat-value {
            font-size: 18px;
            font-weight: 800;
            color: var(--c-text-primary);
        }
    </style>
</head>
<body>
    <div class="app-layout">
        <app-sidebar role="parent" active-path="/parent/children.html"></app-sidebar>
        <div class="app-main">
            <app-topbar username="Parent Portal"></app-topbar>
            <main class="app-content-wrapper">
                <div class="app-content" style="padding: 0;">
                    <div style="margin-bottom: 6px;">
                        <app-breadcrumb path="Parent Portal, My Children"></app-breadcrumb>
                    </div>

                    <!-- Single-Row Compact Header Box per PAGE_RULES.md -->
                    <div class="card" style="margin-bottom: 12px; padding: 6px 14px; background: white; border-radius: 8px; border: 1px solid var(--c-primary-border); box-shadow: 0 1px 2px rgba(0,0,0,0.03); display: flex; align-items: center; justify-content: space-between;">
                        <div style="display: flex; align-items: center; gap: 8px;">
                            <div style="width: 26px; height: 26px; border-radius: 6px; background: #8b5cf6; color: white; display: flex; align-items: center; justify-content: center;">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>
                                </svg>
                            </div>
                            <h2 style="margin: 0; font-size: 14px; font-weight: 800; color: var(--c-text-primary);">Enrolled Children Directory</h2>
                        </div>
                        <div style="display: flex; align-items: center; gap: 8px;">
                            <span id="childCountBadge" style="font-size: 11px; font-weight: 700; color: #6d28d9; background: #f5f3ff; padding: 2px 8px; border-radius: 12px; border: 1px solid #ddd6fe;">
                                Verified Scholars
                            </span>
                        </div>
                    </div>

                    <div id="childrenContainer">
                        <div class="card" style="padding: 40px; text-align: center; color: var(--c-text-muted);">
                            <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="animation: spin 1s linear infinite;"><line x1="12" y1="2" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="22"/><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"/><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"/><line x1="2" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="22" y2="12"/><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"/><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"/></svg>
                                <span>Loading registered children...</span>
                            </div>
                        </div>
                    </div>

                    <app-footer></app-footer>
                </div>
            </main>
        </div>
    </div>

    <script>
        async function loadChildren() {
            const container = document.getElementById('childrenContainer');
            try {
                const res = await fetch('/api/parents/get_children.php');
                const data = await res.json();

                if (data.success && Array.isArray(data.children) && data.children.length > 0) {
                    container.innerHTML = data.children.map(c => `
                        <div class="child-card">
                            <div class="child-header">
                                <div style="display: flex; align-items: center; gap: 14px;">
                                    <div style="width: 44px; height: 44px; border-radius: 10px; background: #eff6ff; color: #1d4ed8; display: flex; align-items: center; justify-content: center; font-weight: 800;">
                                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                                    </div>
                                    <div>
                                        <h2 style="margin: 0; font-size: 18px; font-weight: 800; color: var(--c-text-primary);">${escapeHtml(c.student_name)}</h2>
                                        <span style="font-size: 12px; color: var(--c-text-muted);">Student ID: ${escapeHtml(c.user_code || c.student_id)} • Gender: ${escapeHtml(c.gender || 'Not Specified')}</span>
                                    </div>
                                </div>
                                <div style="display: flex; gap: 8px;">
                                    <a href="../reports/student-report-card.html?student_id=${encodeURIComponent(c.student_id)}" class="btn btn-primary" style="display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; text-decoration: none;">
                                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
                                        <span>View Report Card</span>
                                    </a>
                                </div>
                            </div>
                            <div class="child-stats">
                                <div class="stat-block">
                                    <div class="stat-label">Academic Level</div>
                                    <div class="stat-value">${escapeHtml(c.grade_name || 'Secondary')}</div>
                                </div>
                                <div class="stat-block">
                                    <div class="stat-label">Classroom Stream</div>
                                    <div class="stat-value">${escapeHtml(c.classroom_name || 'Unallocated')}</div>
                                </div>
                                <div class="stat-block">
                                    <div class="stat-label">Enrollment Status</div>
                                    <div class="stat-value" style="color: #047857; font-size: 16px;">Active Scholar</div>
                                </div>
                            </div>
                        </div>
                    `).join('');
                } else {
                    container.innerHTML = `
                        <div class="card" style="padding: 48px; text-align: center; color: var(--c-text-muted);">
                            <div style="display: flex; flex-direction: column; align-items: center; gap: 10px;">
                                <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M16 16s-1.5-2-4-2-4 2-4 2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
                                <span style="font-weight: 700; font-size: 15px;">No children registered under this guardian profile.</span>
                                <span style="font-size: 13px;">Please contact your school administrator to link your parent account with your child's student admission code.</span>
                            </div>
                        </div>
                    `;
                }
            } catch (err) {
                container.innerHTML = `
                    <div class="card" style="padding: 32px; text-align: center; color: var(--c-danger, #dc2626); font-weight: 700;">
                        Unable to connect to children directory service.
                    </div>
                `;
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        document.addEventListener('DOMContentLoaded', loadChildren);
    </script>
</body>
</html>
