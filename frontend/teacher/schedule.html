<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Daily Schedule ‹ Teacher ‹ SHULE CAFE</title>
    
    <link rel="stylesheet" href="../css/design-system.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/teacher-theme.css">
    
    <script type="module" src="../layouts/global-layout.js"></script>
    <script type="module" src="../js/auth/auth-guard.js"></script>
</head>
<body>
    <div class="app-layout">
        <app-sidebar role="teacher" active-path="/teacher/schedule.html"></app-sidebar>
        
        <div class="app-main">
            <app-topbar username="Teacher Portal"></app-topbar>
            
            <main class="app-content-wrapper">
                <div class="app-content">
                    <app-breadcrumb path="Teacher, My Teaching Schedule"></app-breadcrumb>

                    <div class="card" style="margin-top: 14px; padding: 24px;">
                        <h2 style="margin: 0 0 6px; font-size: 20px; font-weight: 800; color: var(--c-text-primary);">📅 My Daily Teaching Schedule</h2>
                        <p style="margin: 0 0 20px; font-size: 13px; color: var(--c-text-muted);">Real-time period matrix and classroom assignments for the active academic year.</p>

                        <div style="overflow-x: auto;">
                            <table class="table" style="width: 100%; font-size: 13px;">
                                <thead>
                                    <tr style="background: #1e293b; color: white;">
                                        <th style="padding: 12px;">Time Slot</th>
                                        <th style="padding: 12px;">Period</th>
                                        <th style="padding: 12px;">Classroom Stream</th>
                                        <th style="padding: 12px;">Subject Course</th>
                                        <th style="padding: 12px;">Status</th>
                                    </tr>
                                </thead>
                                <tbody id="fullScheduleBody">
                                    <tr><td colspan="5" style="text-align:center; padding: 24px;">Loading daily schedule...</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const res = await fetch('/shule-cafe/api/teacher/teacher_portal_api.php?action=dashboard', { credentials: 'include' });
                const data = await res.json();
                if (res.ok && data.success) {
                    const sched = data.schedule || [];
                    const tbody = document.getElementById('fullScheduleBody');
                    if (sched.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding:24px; color:var(--c-text-muted);">No timetable periods scheduled for today.</td></tr>';
                    } else {
                        tbody.innerHTML = sched.map(s => `
                            <tr>
                                <td style="font-weight:700; color:#0284c7;">${s.start_time || '08:00 AM'} - ${s.end_time || '08:40 AM'}</td>
                                <td style="font-weight:700;">${s.period_name || 'Period'}</td>
                                <td style="font-weight:800; color:#78350f;">${s.classroom_name}</td>
                                <td style="font-weight:700;">${s.subject_name}</td>
                                <td><span class="badge badge-success" style="font-weight:700;">Scheduled</span></td>
                            </tr>
                        `).join('');
                    }
                }
            } catch(e) {}
        });
    </script>
</body>
</html>
