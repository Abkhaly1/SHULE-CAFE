<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password ‹ SHULE CAFE</title>
    
    <!-- Design System CSS -->
    <link rel="stylesheet" href="css/design-system.css">
    
    <style>
        body {
            background-color: var(--c-bg-page);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            font-family: var(--font-family);
        }
        
        .auth-container {
            width: 100%;
            max-width: 400px;
            padding: var(--sp-6);
        }
        
        .auth-card {
            background: var(--c-bg-surface);
            padding: var(--sp-8);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            border: 1px solid var(--c-border-light);
        }
        
        .auth-logo {
            text-align: center;
            margin-bottom: var(--sp-8);
            font-size: 24px;
            font-weight: 700;
            color: var(--c-primary);
        }
        
        .auth-title {
            font-size: var(--text-xl);
            font-weight: 600;
            color: var(--c-text-primary);
            margin-bottom: var(--sp-2);
            text-align: center;
        }
        
        .auth-subtitle {
            text-align: center;
            color: var(--c-text-secondary);
            font-size: var(--text-sm);
            margin-bottom: var(--sp-6);
            line-height: 1.5;
        }
        
        .auth-footer {
            margin-top: var(--sp-8);
            text-align: center;
            font-size: var(--text-sm);
            color: var(--c-text-muted);
        }
    </style>
</head>
<body>
    
    <div class="auth-container">
        <div class="auth-logo">
            <!-- Placeholder Logo -->
            SHULE CAFE
        </div>
        
        <div class="auth-card">
            <h1 class="auth-title">Forgot Password</h1>
            <p class="auth-subtitle">Enter your username or official email address to request a password reset.</p>
            
            <div id="resetAlert" class="alert alert-success" style="display: none; margin-bottom: var(--sp-4);">
                If an account exists for that username/email, a reset link has been sent.
            </div>
            
            <form id="forgotPasswordForm">
                <div class="form-group" style="margin-bottom: var(--sp-6);">
                    <label for="identity" class="form-label">Username or Email</label>
                    <input type="text" id="identity" class="form-control" placeholder="Enter username or email" required>
                </div>
                
                <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center;" id="resetBtn">
                    Request Reset
                </button>
                
                <div style="text-align: center; margin-top: var(--sp-4);">
                    <a href="login.html" style="font-size: var(--text-sm); color: var(--c-text-secondary); text-decoration: none; display: inline-flex; align-items: center; gap: 4px;">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
                        Back to Login
                    </a>
                </div>
            </form>
        </div>
        
        <div class="auth-footer">
            &copy; 2026 Shule Cafe. All rights reserved.
        </div>
    </div>

    <script type="module">
        import { AuthService } from './js/auth/auth-service.js';
        
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('forgotPasswordForm');
            const alert = document.getElementById('resetAlert');
            const resetBtn = document.getElementById('resetBtn');
            
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                resetBtn.disabled = true;
                resetBtn.innerHTML = 'Sending...';
                
                const identity = document.getElementById('identity').value;
                
                try {
                    await AuthService.requestPasswordReset(identity);
                    
                    // We always show a generic success message to prevent user enumeration
                    alert.style.display = 'block';
                    form.reset();
                } catch (error) {
                    alert.className = 'alert alert-danger';
                    alert.textContent = 'An error occurred. Please try again later.';
                    alert.style.display = 'block';
                } finally {
                    resetBtn.disabled = false;
                    resetBtn.innerHTML = 'Request Reset';
                }
            });
        });
    </script>
</body>
</html>
