<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Your Account ‹ SHULE CAFE</title>
    
    <link rel="stylesheet" href="../css/design-system.css">
    <link rel="stylesheet" href="../css/layout.css">
</head>
<body style="background: var(--c-bg-page); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: var(--sp-4);">
    
    <div class="card" style="width: 100%; max-width: 440px; padding: var(--sp-8); background: white; border-radius: var(--radius-lg); box-shadow: var(--shadow-md);">
        
        <div style="text-align: center; margin-bottom: var(--sp-6);">
            <div style="width: 48px; height: 48px; border-radius: 50%; background: #fef3c7; color: #d97706; display: inline-flex; align-items: center; justify-content: center; margin-bottom: var(--sp-3);">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-1 6h2v2h-2V7zm0 4h2v6h-2v-6z"/></svg>
            </div>
            <h2 style="margin: 0; font-size: var(--text-xl);">Change Temporary Password</h2>
            <p style="font-size: var(--text-sm); color: var(--c-text-secondary); margin-top: 6px;">
                You logged in with a one-time temporary password. For security reasons, you must set a new permanent password before proceeding.
            </p>
        </div>

        <div id="alertBox" class="alert alert-danger" style="display: none; margin-bottom: var(--sp-4);"></div>

        <form id="changePasswordForm">
            <div class="form-group" style="margin-bottom: var(--sp-4);">
                <label class="form-label">Temporary Password <span style="color:var(--c-danger);">*</span></label>
                <input type="password" id="current_password" class="form-control" placeholder="Enter temporary password" required>
            </div>

            <div class="form-group" style="margin-bottom: var(--sp-4);">
                <label class="form-label">New Password <span style="color:var(--c-danger);">*</span></label>
                <input type="password" id="new_password" class="form-control" placeholder="Minimum 8 characters" minlength="8" required>
            </div>

            <div class="form-group" style="margin-bottom: var(--sp-6);">
                <label class="form-label">Confirm New Password <span style="color:var(--c-danger);">*</span></label>
                <input type="password" id="confirm_password" class="form-control" placeholder="Re-enter new password" minlength="8" required>
            </div>

            <button type="submit" id="submitBtn" class="btn btn-primary" style="width: 100%; justify-content: center; height: 42px;">
                Save New Password & Continue
            </button>
        </form>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('changePasswordForm');
            const alertBox = document.getElementById('alertBox');
            const submitBtn = document.getElementById('submitBtn');

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                alertBox.style.display = 'none';

                const current_password = document.getElementById('current_password').value;
                const new_password = document.getElementById('new_password').value;
                const confirm_password = document.getElementById('confirm_password').value;

                if (new_password !== confirm_password) {
                    alertBox.textContent = 'New passwords do not match.';
                    alertBox.style.display = 'block';
                    return;
                }

                submitBtn.disabled = true;
                submitBtn.textContent = 'Securing Account...';

                try {
                    const res = await fetch('/shule-cafe/api/auth/change_password.php', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        credentials: 'include',
                        body: JSON.stringify({ current_password, new_password, confirm_password })
                    });

                    const result = await res.json();

                    if (res.ok && result.success) {
                        alertBox.className = 'alert alert-success';
                        alertBox.textContent = 'Password updated successfully! Redirecting to dashboard...';
                        alertBox.style.display = 'block';

                        setTimeout(() => {
                            window.location.href = '/shule-cafe/index.php';
                        }, 1000);
                    } else {
                        alertBox.className = 'alert alert-danger';
                        alertBox.textContent = result.message || 'Error updating password.';
                        alertBox.style.display = 'block';
                        submitBtn.disabled = false;
                        submitBtn.textContent = 'Save New Password & Continue';
                    }
                } catch (err) {
                    alertBox.className = 'alert alert-danger';
                    alertBox.textContent = 'Network error updating password.';
                    alertBox.style.display = 'block';
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Save New Password & Continue';
                }
            });
        });
    </script>
</body>
</html>
